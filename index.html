<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam and Thailand trip</title>
<meta name="description" content="Matthew and Amy's trip plan, 19 December 2026 to 3 January 2027: Saigon, Ninh Binh and Bangkok.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Vietnam and Thailand</h1>
    <p>19 Dec 2026 – 3 Jan 2027 · Saigon, Ninh Binh, Bangkok</p>
  </div>
  <nav class="views" aria-label="View">
    <button data-view="map" class="on">Trip map</button>
    <button data-view="budget">Budget</button>
  </nav>
</header>

<div class="days" id="days" role="tablist" aria-label="Days"></div>

<main id="mapView" class="mapview">
  <div id="map" aria-label="Map of the day's stops"></div>
  <aside class="panel" id="panel">
    <button class="handle" id="handle" aria-label="Expand or collapse details" aria-expanded="false"><span></span></button>
    <div class="daybar" id="daybar" hidden></div>
    <div class="dayhead" id="dayhead"></div>
    <article class="card" id="card"></article>
    <ol class="timeline" id="timeline"></ol>
  </aside>
</main>

<main id="budgetView" class="budget" hidden></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
